# Lets RPCS3 use a stream buffer and graph quantum below pipewire-pulse's
# 256-frame floor. The size itself comes from PULSE_LATENCY_MSEC in the game
# launcher; without it RPCS3 keeps its 25 ms request and nothing changes.
# Install to ~/.config/pipewire/pipewire-pulse.conf.d/ and restart pipewire-pulse.
pulse.rules = [
    {
        matches = [ { application.name = "RPCS3" } ]
        actions = {
            update-props = {
                pulse.min.req     = 128/48000
                pulse.min.quantum = 128/48000
            }
        }
    }
]
